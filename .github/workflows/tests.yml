name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stms
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: stms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stms -d stms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: SQLite tests
        run: python -m unittest discover -s tests -v
      - name: PostgreSQL tests
        env:
          STMS_TEST_DATABASE_URL: postgresql://stms:test-only-password@127.0.0.1:5432/stms_test
        run: python -m unittest discover -s tests -v
      - name: Static build and JavaScript syntax
        run: |
          python scripts/build.py
          node --check static/app.js
